apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: app
          image: harbor.dev.local/library/sample-app:REPLACE_WITH_GIT_SHA
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: apps
spec:
  selector:
    app: sample-app
  ports:
    - name: http
      port: 80
      targetPort: http
