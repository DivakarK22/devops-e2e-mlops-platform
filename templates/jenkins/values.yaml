controller:
  numExecutors: 0
  admin:
    createSecret: true
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - sonar
    - harbor
    - credentials-binding
    - pipeline-stage-view
  JCasC:
    defaultConfig: true
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}
  ingress:
    enabled: false
  healthProbes: true
persistence:
  enabled: true
  size: 20Gi
agent:
  enabled: true
  podRetention: "never"
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "4", memory: 8Gi}
  containerCap: 50
  idleMinutes: 1
  connectTimeout: 100
